<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
            margin: 0;
        }
        
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #333;
        }
        
        .icon {
            font-size: 24px;
            margin-right: 8px;
        }
        
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 8px;
            background: #2a2a2a;
            border-radius: 6px;
        }
        
        .switch {
            position: relative;
            width: 50px;
            height: 24px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: #4CAF50;
        }
        
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        
        .stats {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        
        .buttons {
            display: flex;
            gap: 8px;
        }
        
        button {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-size: 12px;
        }
        
        button:hover {
            background: #45a049;
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .status {
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
            padding: 4px;
            border-radius: 4px;
        }
        
        .status.active {
            background: #4CAF50;
        }
        
        .status.inactive {
            background: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="icon">🤖</span>
        <h3 style="margin: 0;">Copilot Auto Continue</h3>
    </div>
    
    <div class="toggle-container">
        <span>Auto-click enabled</span>
        <label class="switch">
            <input type="checkbox" id="enableToggle">
            <span class="slider"></span>
        </label>
    </div>
    
    <div class="stats">
        <div class="stat-row">
            <span>Status:</span>
            <span id="status">Loading...</span>
        </div>
        <div class="stat-row">
            <span>Total clicks:</span>
            <span id="clickCount">0</span>
        </div>
        <div class="stat-row">
            <span>Active tabs:</span>
            <span id="activeTabs">0</span>
        </div>
    </div>
    
    <div class="buttons">
        <button id="clickNow">Click Now</button>
        <button id="reset">Reset</button>
    </div>
    
    <div class="status inactive" id="statusIndicator">
        Inactive
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
