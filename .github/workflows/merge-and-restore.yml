name: Smart Merge and Restore Features

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - quantum-fixes-2025

jobs:
  smart-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run merge-resolution script
        run: |
          npm install
          node merge-resolution.js

      - name: Upload merge summary
        uses: actions/upload-artifact@v4
        with:
          name: merge-summary
          path: MERGE_SUMMARY.md
